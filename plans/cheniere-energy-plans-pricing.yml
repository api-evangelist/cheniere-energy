plan_count: 0
note: >-
  There is no API pricing because there is no API product. The Cheniere LNG Connection
  informational-postings API is free and unauthenticated because FERC 18 CFR 284.13 requires an
  interstate pipeline to make these postings publicly available — it is regulatory publication,
  not a commercial offering. There is no signup, no key, no quota and no paid tier, and there is
  nothing for Cheniere to publish here.
  Cheniere's actual commercial products — long-term LNG sale and purchase agreements, integrated
  production marketing and spot cargoes — are negotiated bilaterally and are not sold, quoted or
  provisioned through any API.
