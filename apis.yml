- aid: cheniere-energy:lng-connection
  name: Cheniere LNG Connection Pipeline Informational Postings API
  description: >-
    The public, unauthenticated JSON API behind Cheniere's LNG Connection site, which publishes the
    FERC-mandated informational postings for Cheniere Creole Trail Pipeline, L.P. (tspNo 200) and
    Cheniere Corpus Christi Pipeline, L.P. (tspNo 400). It serves operationally available and unsubscribed
    capacity by NAESB nomination cycle, firm and interruptible transactional reporting, the quarterly
    Index of Customers, daily and comingled gas quality, posted imbalances, operational notices, and
    the location, station and contact reference data. 35 operations, all data operations read-only,
    no credential of any kind. Cheniere publishes no OpenAPI and no documentation for it; the specification
    in this repository was derived by API Evangelist from the provider's own client bundle plus live
    anonymous probes on 2026-09-06 and is labelled as derived.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/cheniere-energy.png
