aid: cheniere-energy
name: Cheniere Energy
kind: company
description: 'Cheniere Energy, Inc. is an international energy company headquartered in Houston, Texas,
  and the leading producer and exporter of liquefied natural gas (LNG) in the United States, operating
  the Sabine Pass terminal in Louisiana and the Corpus Christi terminal in Texas. It also owns two FERC-regulated
  interstate natural gas pipelines, Cheniere Creole Trail Pipeline and Cheniere Corpus Christi Pipeline.
  Cheniere runs no developer program and publishes no API documentation, yet it does operate one public,
  unauthenticated JSON API: the LNG Connection informational-postings API at lngconnectionapi.cheniere.com,
  serving the pipeline capacity, transactional reporting, Index of Customers, gas quality, imbalance and
  notice postings that FERC 18 CFR 284.13 requires, in the NAESB Wholesale Gas Quadrant data model.'
type: Index
deliveryModel:
  model: public-api
  open_source: false
  commercial: false
  callable_host: true
  label: Public unauthenticated API published under regulatory mandate, not sold as a product
  confidence: high
  source:
  - probe
  generated: '2026-09-06'
  method: probed
  note: 'Established by live anonymous probes on 2026-09-06: https://lngconnectionapi.cheniere.com/api/Page/GetPages
    returned HTTP 200 with real posting data and no credential. The host is callable, but nothing about
    it is licensed or sold — it exists to satisfy FERC 18 CFR 284.13.'
accessModel:
  pricing: free
  onboarding: none
  trial: false
  try_now: true
  public: true
  label: Free and open — no signup, no key
  confidence: high
  source:
  - probe
  generated: '2026-09-06'
  method: probed
  note: No signup, no API key, no OAuth and no pricing page anywhere in the estate. Nine of eleven endpoints
    probed anonymously on 2026-09-06 returned HTTP 200; the two failures were server-side 500s, not auth
    challenges.
position: Producing
access: 3rd-Party
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/cheniere-energy.png
