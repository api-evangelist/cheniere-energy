specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Cheniere Energy
providerId: cheniere-energy
generated: '2026-09-06'
method: probed
source: >-
  Response headers observed on live anonymous requests to
  https://lngconnectionapi.cheniere.com on 2026-09-06, plus a full read of www.cheniere.com
  (complete 36-URL sitemap) confirming no published limits document exists.
supersedes: >-
  This file replaces a 2026-05-04 bulk-sweep scaffold that asserted free/professional/enterprise
  tiers with 10/100/1000 requests-per-minute limits and X-RateLimit-* headers. None of that was
  ever true of Cheniere: there are no tiers, no API keys and no rate-limit headers. The scaffold
  was fabricated by that sweep, not harvested, and has been removed.
limit_count: 0
note: >-
  Cheniere publishes no rate limits, and the API emits no rate-limit signal of any kind. Nine
  anonymous requests across eleven endpoints on 2026-09-06 returned no X-RateLimit-*, no
  RateLimit-*, no Retry-After and no 429. The absence is genuine, not unmeasured — but it is also
  not a guarantee: an undocumented, unsignalled limit can exist and would be indistinguishable
  from a fault, because the API's only failure envelope is a generic 500.
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
headers_observed:
  - Cache-Control
  - Pragma
  - Expires
  - Content-Type
  - Server
  - X-AspNet-Version
  - X-Powered-By
  - Set-Cookie
  - Vary
responseCodes:
  throttled: null
  quotaExceeded: null
limits: []
policies: []
evidence:
  - url: https://lngconnectionapi.cheniere.com/api/Capacity/GetCycles
    status: 200
    note: Full response header set captured; no rate-limit header present.
  - url: https://lngconnectionapi.cheniere.com/api/Page/GetPages
    status: 200
guidance: >-
  Treat the surface as unmetered but unguaranteed. Because responses are explicitly uncacheable
  (Cache-Control no-cache, no ETag, no Last-Modified) a polling consumer pays full transfer every
  time; pace requests to the data's real cadence — per nomination cycle for capacity, per gas day
  for quality and transactional reporting, monthly for imbalances, quarterly for the Index of
  Customers — rather than to any limit, since there is none to discover.
maintainers:
