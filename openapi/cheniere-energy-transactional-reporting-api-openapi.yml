components:
  schemas:
    TransactionalReportRow:
      type: object
      description: 'Transactional reporting row (firm / interruptible / capacity release) per FERC 18 CFR 284.13(b): contract, shipper, rate and location detail.'
      properties:
        postDateTime:
          type: string
          format: date-time
        tspNo:
          type: integer
        tspName:
          type: string
        tspDuns:
          type: string
        contractHolder:
          type: string
        contractHolderName:
          type: string
        contractHolderProp:
          type: string
        serviceRequesterContract:
          type: string
        contractBeginDate:
          type: string
          format: date-time
        contractEndDate:
          type: string
          format: date-time
        contractStatus:
          type: string
        ctrMDQ:
          type: number
        affil:
          type: string
        rateCharged:
          type: number
        maxTariffRate:
          type: number
        rateSchedule:
          type: string
        resRateBasis:
          type: string
        rateID:
          type: string
        mktBasedRateInd:
          type: string
        ngtdRateInd:
          type: string
        surchgInd:
          type: integer
        locId:
          type: string
        ctrLocMDQ:
          type: number
        loc:
          type: string
        locPurpose:
          type: string
        locQTI:
          type: integer
    ReportEnvelope:
      type: object
      description: Common envelope returned by the dated report endpoints. `report` carries the rows; `beginDate`/`endDate` echo the requested gas-day range in M/D/YYYY.
      properties:
        report:
          type: array
          items:
            type: object
        beginDate:
          type: string
          description: Echo of the requested begin gas day, M/D/YYYY.
        endDate:
          type: string
          description: Echo of the requested end gas day, M/D/YYYY.
    Error:
      type: object
      description: 'ASP.NET Web API error envelope. Not RFC 9457 problem+json: a single `message` string, no `type`, `title` or `status` member.'
      properties:
        message:
          type: string
      required:
      - message
