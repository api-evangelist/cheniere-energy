paths:
  /api/Transactional/GetFirm:
    get:
      operationId: getFirmTransactionalReport
      summary: Firm transactional reporting
      tags:
      - Transactional Reporting
      description: 'FERC 18 CFR 284.13(b) firm transportation transactional reporting: contract, shipper, affiliate indicator, rate charged vs maximum tariff rate, and per-location MDQ.'
      parameters:
      - name: tspNo
        in: query
        required: true
        schema:
          type: integer
        description: 'Transportation service provider (company) id. Observed values: 200 = Cheniere Creole Trail Pipeline, L.P. (DUNS 800742780, FERC CID C001506); 400 = Cheniere Corpus Christi Pipeline, L.P. (DUNS 079841991). 600 and 800 route in the client but returned no rows when probed.'
      - name: beginDate
        in: query
        required: true
        schema:
          type: string
        description: Begin gas day. Accepted as YYYY-MM-DD or M/D/YYYY.
      - name: endDate
        in: query
        required: true
        schema:
          type: string
        description: End gas day. Accepted as YYYY-MM-DD or M/D/YYYY.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ReportEnvelope'
                - type: object
                  properties:
                    report:
                      type: array
                      items:
                        $ref: '#/components/schemas/TransactionalReportRow'
        '404':
          description: 'Error. ASP.NET Web API envelope: {"message": "..."}.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Error. ASP.NET Web API envelope: {"message": "..."}.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
